name: Build Xiaomi odin Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig 文件名（位于 arch/arm64/configs/ 下）"
        required: true
        default: "odin_defconfig"
      ndk_version:
        description: "Android NDK 版本号（对应 GitHub Releases 的 tag，如 r29、r28c）"
        required: true
        default: "r29"
  push:
    branches:
      - lineage-23.2
    paths:
      - "arch/arm64/configs/odin_defconfig"
      - ".github/workflows/build-kernel.yml"

env:
  KERNEL_DIR: kernel
  NDK_DIR: ndk
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  NDK_VERSION: r29

jobs:
  build:
    name: Build kernel (${{ github.event.inputs.defconfig || 'odin_defconfig' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout kernel source (depth=1)
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libncurses-dev \
            build-essential zip unzip curl device-tree-compiler \
            python3 rsync

      - name: Download Android NDK (${{ github.event.inputs.ndk_version || env.NDK_VERSION }})
        env:
          # 改用 Android NDK 官方 GitHub Releases 对应的 dl.google.com 直链下载完整包，
          # 这是 Google 官方稳定发布、版本号明确、可反复验证的下载方式，
          # 不依赖 AOSP 内部仓库的分支/目录结构（之前在那上面踩过坑）。
          # 参考: https://github.com/android/ndk/releases
          NDK_VER: ${{ github.event.inputs.ndk_version || env.NDK_VERSION }}
        run: |
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          echo "Downloading: $url"
          curl -fL --retry 3 -o ndk.zip "$url"
          unzip -q ndk.zip
          rm -f ndk.zip
          # 解压后目录名固定为 android-ndk-<版本号>，统一重命名方便后续引用
          mv "android-ndk-${NDK_VER}" "${{ env.NDK_DIR }}"
          CLANG_BIN="${{ github.workspace }}/${{ env.NDK_DIR }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          du -sh "${{ env.NDK_DIR }}"

      - name: Show toolchain version
        run: clang --version

      - name: Prepare output directory
        run: mkdir -p "${{ env.OUT_DIR }}"

      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'odin_defconfig' }}
        run: |
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot" \
            -maxdepth 2 \
            \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -v {} artifacts/ \; || true
          cp -v build.log artifacts/ || true
          du -sh artifacts/

      - name: Clean up build workspace
        if: always()
        run: |
          # 编译中间产物（.o/.ko/vmlinux 调试符号等）体积很大，成品已收集到 artifacts/，
          # 及时清理避免占用 runner 磁盘、加快后续步骤。
          rm -rf "${{ env.OUT_DIR }}" "${{ env.KERNEL_DIR }}" "${{ env.CLANG_DIR }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
