name: Build Xiaomi odin Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig 文件名（位于 arch/arm64/configs/ 下）"
        required: true
        default: "odin_defconfig"
      clang_version:
        description: "AOSP clang 版本目录名（mirror-goog-main-llvm-toolchain-source 分支下的子目录）"
        required: true
        default: "clang-r574158"
  push:
    branches:
      - lineage-23.2
    paths:
      - "arch/arm64/configs/odin_defconfig"
      - ".github/workflows/build-kernel.yml"

env:
  KERNEL_DIR: kernel
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  CLANG_VERSION: clang-r574158

jobs:
  build:
    name: Build kernel (${{ github.event.inputs.defconfig || 'odin_defconfig' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout kernel source (depth=1)
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libncurses-dev \
            build-essential zip unzip curl device-tree-compiler \
            python3 rsync

      - name: Download AOSP clang (${{ github.event.inputs.clang_version || env.CLANG_VERSION }})
        env:
          # AOSP clang prebuilt 仓库里所有版本都在同一分支（main）下，
          # 按版本号分成不同子目录（例如 clang-r574158/），不是独立分支。
          # 用 git clone --depth=1 + sparse-checkout 只拉取需要的那个子目录，
          # 避免下载整个仓库（历史巨大、包含全部历史版本的 clang 二进制）。
          CLANG_VER: ${{ github.event.inputs.clang_version || env.CLANG_VERSION }}
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${{ env.CLANG_DIR }}"
          cd "${{ env.CLANG_DIR }}"
          git sparse-checkout init --cone
          git sparse-checkout set "$CLANG_VER"
          git checkout
          cd ..
          chmod -R +x "${{ env.CLANG_DIR }}/${CLANG_VER}/bin"
          echo "${{ github.workspace }}/${{ env.CLANG_DIR }}/${CLANG_VER}/bin" >> "$GITHUB_PATH"
          # sparse-checkout 的 .git 元数据本身也占空间（含 pack 索引等），编译不需要，直接删掉
          rm -rf "${{ env.CLANG_DIR }}/.git"
          du -sh "${{ env.CLANG_DIR }}/${CLANG_VER}"

      - name: Show toolchain version
        run: clang --version

      - name: Prepare output directory
        run: mkdir -p "${{ env.OUT_DIR }}"

      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'odin_defconfig' }}
        run: |
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot" \
            -maxdepth 2 \
            \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -v {} artifacts/ \; || true
          cp -v build.log artifacts/ || true
          du -sh artifacts/

      - name: Clean up build workspace
        if: always()
        run: |
          # 编译中间产物（.o/.ko/vmlinux 调试符号等）体积很大，成品已收集到 artifacts/，
          # 及时清理避免占用 runner 磁盘、加快后续步骤。
          rm -rf "${{ env.OUT_DIR }}" "${{ env.KERNEL_DIR }}" "${{ env.CLANG_DIR }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
