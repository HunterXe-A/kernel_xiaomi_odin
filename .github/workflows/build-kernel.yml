name: Build Xiaomi odin Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig 文件名（位于 arch/arm64/configs/ 下）"
        required: true
        default: "odin_defconfig"
      clang_version:
        description: "AOSP clang 版本目录名"
        required: true
        default: "clang-r574158"
  push:
    branches:
      - lineage-23.2
    paths:
      - "arch/arm64/configs/odin_defconfig"
      - ".github/workflows/build-kernel.yml"

env:
  KERNEL_DIR: kernel
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: Build kernel (${{ github.event.inputs.defconfig || 'odin_defconfig' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker system prune -af || true

      - name: Checkout kernel source (depth=1)
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libncurses-dev gawk openssl libssl-dev \
            bc squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
            minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python3

      - name: Download AOSP clang (${{ github.event.inputs.clang_version || 'clang-r574158' }}), depth=1
        env:
          CLANG_VER: ${{ github.event.inputs.clang_version || 'clang-r574158' }}
        run: |
          git clone --depth=1 -b "$CLANG_VER" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${{ env.CLANG_DIR }}"
          echo "${{ github.workspace }}/${{ env.CLANG_DIR }}/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: |
          export PATH="${{ github.workspace }}/${{ env.CLANG_DIR }}/bin:$PATH"
          clang --version

      - name: Prepare output directory
        run: mkdir -p "${{ env.OUT_DIR }}"

      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'odin_defconfig' }}
        run: |
          export PATH="${{ github.workspace }}/${{ env.CLANG_DIR }}/bin:$PATH"
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ github.workspace }}/${{ env.CLANG_DIR }}/bin:$PATH"
          make -j"$(nproc)" \
            O="${{ github.workspace }}/${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            SUBARCH="${{ env.SUBARCH }}" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot" \
            -maxdepth 2 \
            \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -v {} artifacts/ \; || true
          cp -v build.log artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
